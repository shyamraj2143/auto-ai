name: Fix production API endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-api-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce same-origin production API endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/api/client.ts')
          s = p.read_text()
          marker = 'const PUBLIC_API_BASE_URL = '
          start = s.find(marker)
          if start < 0:
              raise SystemExit('PUBLIC_API_BASE_URL declaration not found')
          end = s.find(';', start)
          if end < 0:
              raise SystemExit('PUBLIC_API_BASE_URL declaration is malformed')
          desired = 'const PUBLIC_API_BASE_URL = "https://autoai.site.je/api/v1";'
          current = s[start:end + 1]
          if current != desired:
              p.write_text(s[:start] + desired + s[end + 1:])
              print(f'Updated PUBLIC_API_BASE_URL: {current} -> {desired}')
          else:
              print('PUBLIC_API_BASE_URL already uses same-origin production API.')
          PY
      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/api/client.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: use same-origin API proxy in production'
          git push
