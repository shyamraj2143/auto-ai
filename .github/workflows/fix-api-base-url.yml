name: Fix production API endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-api-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce same-origin production API endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/api/client.ts')
          s = p.read_text()
          marker = 'const PUBLIC_API_BASE_URL = '
          start = s.find(marker)
          if start < 0:
              raise SystemExit('PUBLIC_API_BASE_URL declaration not found')
          end = s.find(';', start)
          if end < 0:
              raise SystemExit('PUBLIC_API_BASE_URL declaration is malformed')
          desired = 'const PUBLIC_API_BASE_URL = "https://autoai.site.je/api/v1";'
          s = s[:start] + desired + s[end + 1:]

          old_runtime = 'const rawRuntimeUrl = isBrowser() ? window.__AUTO_AI_API_URL__?.trim() || "" : "";'
          new_runtime = 'const rawRuntimeUrl = isBrowser() && window.location.hostname === "autoai.site.je" ? "" : (isBrowser() ? window.__AUTO_AI_API_URL__?.trim() || "" : "");'
          if old_runtime in s:
              s = s.replace(old_runtime, new_runtime, 1)

          old_build = 'const rawBuildUrl = import.meta.env.VITE_API_URL?.trim() || "";'
          new_build = 'const rawBuildUrl = isBrowser() && window.location.hostname === "autoai.site.je" ? "" : (import.meta.env.VITE_API_URL?.trim() || "");'
          if old_build in s:
              s = s.replace(old_build, new_build, 1)

          p.write_text(s)
          print('Production web API is forced to same-origin /api/v1.')
          PY
      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/api/client.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: force same-origin API on production web'
          git push
