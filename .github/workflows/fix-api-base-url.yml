name: Fix production API endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-api-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix production API endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/api/client.ts')
          s = p.read_text()
          old = 'const PUBLIC_API_BASE_URL = "https://autoai.site.je/api/v1";'
          new = 'const PUBLIC_API_BASE_URL = "https://auto-ai-app-download.up.railway.app/api/v1";'
          if old not in s:
              print('Production API endpoint already fixed or source differs; no change needed.')
          else:
              p.write_text(s.replace(old, new, 1))
              print('Updated production API endpoint.')
          PY
      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/api/client.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: use Railway backend API for production mobile login'
          git push