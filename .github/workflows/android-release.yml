name: Automatic Android update

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: auto-android-update-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-publish-notify:
    name: Build, publish and notify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUTO_AI_API_BASE_URL: https://auto-ai-production-a6ef.up.railway.app/api/v1
      AUTO_AI_ADMIN_EMAIL: ${{ secrets.AUTO_AI_ADMIN_EMAIL }}
      AUTO_AI_ADMIN_PASSWORD: ${{ secrets.AUTO_AI_ADMIN_PASSWORD }}
      AUTO_AI_ANDROID_KEYSTORE_BASE64: ${{ secrets.AUTO_AI_ANDROID_KEYSTORE_BASE64 }}
      AUTO_AI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AUTO_AI_ANDROID_KEYSTORE_PASSWORD }}
      AUTO_AI_ANDROID_KEY_ALIAS: ${{ secrets.AUTO_AI_ANDROID_KEY_ALIAS }}
      AUTO_AI_ANDROID_KEY_PASSWORD: ${{ secrets.AUTO_AI_ANDROID_KEY_PASSWORD }}
      AUTO_AI_GOOGLE_WEB_CLIENT_ID: ${{ secrets.AUTO_AI_GOOGLE_WEB_CLIENT_ID }}
      AUTO_AI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AUTO_AI_GOOGLE_SERVICES_JSON_BASE64 }}
      AUTO_AI_UPDATE_NOTIFY_SECRET: ${{ secrets.AUTO_AI_UPDATE_NOTIFY_SECRET }}
      AUTO_AI_HEALTH_URL: ${{ secrets.AUTO_AI_HEALTH_URL }}
      AUTO_AI_EXPECTED_SIGNING_SHA256: ${{ secrets.AUTO_AI_EXPECTED_SIGNING_SHA256 }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate automatic-release secrets
        shell: bash
        run: |
          missing=()
          for name in \
            AUTO_AI_ANDROID_KEYSTORE_BASE64 \
            AUTO_AI_ANDROID_KEYSTORE_PASSWORD \
            AUTO_AI_ANDROID_KEY_ALIAS \
            AUTO_AI_ANDROID_KEY_PASSWORD \
            AUTO_AI_ADMIN_EMAIL \
            AUTO_AI_ADMIN_PASSWORD \
            AUTO_AI_UPDATE_NOTIFY_SECRET \
            AUTO_AI_EXPECTED_SIGNING_SHA256; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions repository secrets: %s\n' "${missing[*]}" >&2
            echo 'Add these as repository Actions secrets so main pushes never wait for an environment approval.' >&2
            exit 1
          fi

      - name: Generate unique mandatory version
        shell: bash
        run: |
          mkdir -p .android-signing
          printf '%s' "$AUTO_AI_ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/auto-ai-release.jks
          echo "AUTO_AI_ANDROID_KEYSTORE=$PWD/.android-signing/auto-ai-release.jks" >> "$GITHUB_ENV"
          version_code=$((200000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          echo "AUTO_AI_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "AUTO_AI_ANDROID_VERSION_NAME=1.0.$version_code" >> "$GITHUB_ENV"
          changelog="$(git log -1 --pretty=%s | tr '\r\n' ' ' | cut -c1-180)"
          {
            echo 'AUTO_AI_CHANGELOG<<AUTOAI_EOF'
            echo "${changelog:-AutoAI automatic update}"
            echo 'AUTOAI_EOF'
          } >> "$GITHUB_ENV"
          if [ -n "${AUTO_AI_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$AUTO_AI_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Test backend and frontend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          PYTHONPATH=backend pytest -q backend/tests
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Build signed Android APK
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          AUTO_AI_SKIP_COMPRESSION=1 \
          VITE_API_URL="$AUTO_AI_API_BASE_URL" \
          VITE_GOOGLE_WEB_CLIENT_ID="$AUTO_AI_GOOGLE_WEB_CLIENT_ID" \
          npm run build

          test -f frontend/dist/index.html
          test -s frontend/dist/models/face_landmarker.task
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html

          chmod +x android/gradlew
          ./android/gradlew -p android :app:testDebugUnitTest assembleRelease
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p output/android
          cp android/app/build/outputs/apk/release/app-release.apk output/android/auto-ai.apk

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs output/android/auto-ai.apk | tee output/android/signing.txt
          actual_cert="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' output/android/signing.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "$AUTO_AI_EXPECTED_SIGNING_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo 'APK signing certificate mismatch.' >&2
            exit 1
          fi

      - name: Publish latest GitHub APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="output/android/auto-ai.apk"
          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk_path")"
          tag="android-${AUTO_AI_ANDROID_VERSION_CODE}"
          notes="$(mktemp)"
          {
            echo "Version-Code: ${AUTO_AI_ANDROID_VERSION_CODE}"
            echo "Version-Name: ${AUTO_AI_ANDROID_VERSION_NAME}"
            echo "SHA256: ${sha256}"
            echo "File-Size: ${size}"
            echo "Commit-SHA: ${GITHUB_SHA}"
            echo "Force-Update: true"
            echo "Changelog: ${AUTO_AI_CHANGELOG}"
            echo
            echo "Automatically built from main commit ${GITHUB_SHA}."
          } > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_path" --clobber
            gh release edit "$tag" --title "Auto-AI Android ${AUTO_AI_ANDROID_VERSION_NAME}" --notes-file "$notes" --latest
          else
            gh release create "$tag" "$apk_path" \
              --title "Auto-AI Android ${AUTO_AI_ANDROID_VERSION_NAME}" \
              --notes-file "$notes" \
              --latest
          fi

          asset_url="$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "auto-ai.apk") | .url')"
          python scripts/verify_release_asset.py --url "$asset_url" --size "$size" --sha256 "$sha256"

      - name: Wait briefly for Railway without blocking APK release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          health_url="${AUTO_AI_HEALTH_URL:-${AUTO_AI_API_BASE_URL%/}/health}"
          python scripts/wait_for_railway_deployment.py --health-url "$health_url" --commit-sha "$EXPECTED_COMMIT" || \
            echo '::warning::Railway commit verification timed out; continuing with retry-based metadata publication.'

      - name: Publish mandatory APK metadata with retries
        shell: bash
        run: |
          success=0
          for attempt in $(seq 1 12); do
            if python scripts/publish_android_release.py \
              --api-url "$AUTO_AI_API_BASE_URL" \
              --apk output/android/auto-ai.apk \
              --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
              --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
              --changelog "$AUTO_AI_CHANGELOG" \
              --release-notes "Automatic main update from commit ${GITHUB_SHA}." \
              --metadata-only \
              --force-update; then
              success=1
              break
            fi
            echo "Metadata publication attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

      - name: Notify every registered Android installation
        shell: bash
        run: |
          success=0
          for attempt in $(seq 1 8); do
            if python scripts/notify_android_update.py \
              --api-url "$AUTO_AI_API_BASE_URL" \
              --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
              --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
              --changelog "$AUTO_AI_CHANGELOG"; then
              success=1
              break
            fi
            echo "Update notification attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-${{ env.AUTO_AI_ANDROID_VERSION_NAME }}
          path: output/android/auto-ai.apk
          if-no-files-found: error
          retention-days: 14
