name: Android release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.release-status/**'
  workflow_dispatch:

# Never cancel a production release because another main commit arrived.
# Every main push gets its own versioned APK; release-status bookkeeping is ignored above.
concurrency:
  group: android-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      AUTO_AI_API_BASE_URL: https://auto-ai-production-a6ef.up.railway.app/api/v1
      AUTO_AI_ANDROID_KEYSTORE_BASE64: ${{ secrets.AUTO_AI_ANDROID_KEYSTORE_BASE64 }}
      AUTO_AI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AUTO_AI_ANDROID_KEYSTORE_PASSWORD }}
      AUTO_AI_ANDROID_KEY_ALIAS: ${{ secrets.AUTO_AI_ANDROID_KEY_ALIAS }}
      AUTO_AI_ANDROID_KEY_PASSWORD: ${{ secrets.AUTO_AI_ANDROID_KEY_PASSWORD }}
      AUTO_AI_GOOGLE_WEB_CLIENT_ID: ${{ secrets.AUTO_AI_GOOGLE_WEB_CLIENT_ID }}
      AUTO_AI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AUTO_AI_GOOGLE_SERVICES_JSON_BASE64 }}
      AUTO_AI_EXPECTED_SIGNING_SHA256: ${{ secrets.AUTO_AI_EXPECTED_SIGNING_SHA256 }}
      AUTO_AI_ADMIN_EMAIL: ${{ secrets.AUTO_AI_ADMIN_EMAIL }}
      AUTO_AI_ADMIN_PASSWORD: ${{ secrets.AUTO_AI_ADMIN_PASSWORD }}
      AUTO_AI_UPDATE_NOTIFY_SECRET: ${{ secrets.AUTO_AI_UPDATE_NOTIFY_SECRET }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare production signing and version
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AUTO_AI_ANDROID_KEYSTORE_BASE64 \
            AUTO_AI_ANDROID_KEYSTORE_PASSWORD \
            AUTO_AI_ANDROID_KEY_ALIAS \
            AUTO_AI_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing production signing values: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          mkdir -p .android-signing
          printf '%s' "$AUTO_AI_ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/auto-ai-release.jks
          test -s .android-signing/auto-ai-release.jks
          echo "AUTO_AI_ANDROID_KEYSTORE=$PWD/.android-signing/auto-ai-release.jks" >> "$GITHUB_ENV"

          version_code=$((400000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          version_name="1.0.${version_code}"
          echo "AUTO_AI_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "AUTO_AI_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"

          changelog="$(git log -1 --pretty=%s | tr '\r\n' ' ' | cut -c1-180)"
          {
            echo 'AUTO_AI_CHANGELOG<<AUTOAI_EOF'
            echo "${changelog:-AutoAI mobile update}"
            echo 'AUTOAI_EOF'
          } >> "$GITHUB_ENV"

          if [ -n "${AUTO_AI_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$AUTO_AI_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          test -s android/app/google-services.json

      - name: Build production web bundle and signed APK
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix frontend
          AUTO_AI_SKIP_COMPRESSION=1 \
          VITE_API_URL="$AUTO_AI_API_BASE_URL" \
          VITE_GOOGLE_WEB_CLIENT_ID="$AUTO_AI_GOOGLE_WEB_CLIENT_ID" \
          npm run build

          test -f frontend/dist/index.html
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html

          chmod +x android/gradlew
          ./android/gradlew -p android :app:testDebugUnitTest assembleRelease
          test -s android/app/build/outputs/apk/release/app-release.apk
          mkdir -p output/android
          cp android/app/build/outputs/apk/release/app-release.apk output/android/auto-ai.apk

      - name: Verify APK signature matches installed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"

          "$apksigner" verify --verbose --print-certs output/android/auto-ai.apk | tee output/android/new-signing.txt
          new_cert="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' output/android/new-signing.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$new_cert"

          mkdir -p output/previous
          previous_cert=""
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern auto-ai.apk --dir output/previous --clobber >/dev/null 2>&1 && [ -s output/previous/auto-ai.apk ]; then
            "$apksigner" verify --verbose --print-certs output/previous/auto-ai.apk | tee output/android/previous-signing.txt
            previous_cert="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' output/android/previous-signing.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          fi

          expected_cert="$(printf '%s' "${AUTO_AI_EXPECTED_SIGNING_SHA256:-}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          trusted_cert="${previous_cert:-$expected_cert}"
          if [ -z "$trusted_cert" ]; then
            echo 'No previous APK or expected signing certificate is available.' >&2
            exit 1
          fi
          if [ "$new_cert" != "$trusted_cert" ]; then
            echo 'New APK signing certificate does not match the installed release.' >&2
            exit 1
          fi
          echo "Verified compatible signing certificate: ${new_cert:0:16}..."

      - name: Publish latest GitHub APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="output/android/auto-ai.apk"
          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk_path")"
          tag="android-${AUTO_AI_ANDROID_VERSION_CODE}"
          notes="$(mktemp)"
          {
            echo "Version-Code: ${AUTO_AI_ANDROID_VERSION_CODE}"
            echo "Version-Name: ${AUTO_AI_ANDROID_VERSION_NAME}"
            echo "SHA256: ${sha256}"
            echo "File-Size: ${size}"
            echo "Commit-SHA: ${GITHUB_SHA}"
            echo "Force-Update: true"
            echo "Changelog: ${AUTO_AI_CHANGELOG}"
            echo
            echo "Direct production Android release from main commit ${GITHUB_SHA}."
          } > "$notes"

          gh release create "$tag" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Auto-AI Android ${AUTO_AI_ANDROID_VERSION_NAME}" \
            --notes-file "$notes" \
            --latest

          asset_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "auto-ai.apk") | .url')"
          test -n "$asset_url"
          python scripts/verify_release_asset.py --url "$asset_url" --size "$size" --sha256 "$sha256"

      - name: Publish APK metadata to backend
        if: ${{ env.AUTO_AI_ADMIN_EMAIL != '' && env.AUTO_AI_ADMIN_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_android_release.py \
            --api-url "$AUTO_AI_API_BASE_URL" \
            --apk output/android/auto-ai.apk \
            --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
            --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
            --changelog "$AUTO_AI_CHANGELOG" \
            --release-notes "Direct main release ${GITHUB_SHA}." \
            --metadata-only \
            --force-update

      - name: Notify installed Android apps
        if: ${{ env.AUTO_AI_UPDATE_NOTIFY_SECRET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/notify_android_update.py \
            --api-url "$AUTO_AI_API_BASE_URL" \
            --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
            --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
            --changelog "$AUTO_AI_CHANGELOG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-ai-${{ env.AUTO_AI_ANDROID_VERSION_NAME }}
          path: output/android/auto-ai.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set +e
          mkdir -p .release-status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": os.environ.get("RELEASE_JOB_STATUS", "unknown"),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "version_code": os.environ.get("AUTO_AI_ANDROID_VERSION_CODE", ""),
              "version_name": os.environ.get("AUTO_AI_ANDROID_VERSION_NAME", ""),
              "release_tag": f"android-{os.environ.get('AUTO_AI_ANDROID_VERSION_CODE', '')}" if os.environ.get("AUTO_AI_ANDROID_VERSION_CODE") else "",
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          with open('.release-status/android.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY

          encoded="$(base64 -w0 .release-status/android.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-status/android.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/android.json" \
              -f message='chore: record Android release result [skip ci]' \
              -f content="$encoded" \
              -f sha="$current_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/android.json" \
              -f message='chore: record Android release result [skip ci]' \
              -f content="$encoded" \
              -f branch=main >/dev/null
          fi
