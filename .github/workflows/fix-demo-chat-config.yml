name: One-time public demo config fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore public demo settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/core/config.py')
          s = p.read_text()
          marker = '    RESPONSE_CACHE_MAX_ITEM_CHARS: int = 100_000\n'
          additions = (
              '    PUBLIC_DEMO_CHAT_ENABLED: bool = True\n'
              '    PUBLIC_DEMO_CHAT_LIMIT: int = 5\n'
              '    PUBLIC_DEMO_CHAT_TTL_HOURS: int = 24\n'
          )
          if 'PUBLIC_DEMO_CHAT_ENABLED:' not in s:
              if marker not in s:
                  raise SystemExit('Expected config insertion marker was not found.')
              s = s.replace(marker, marker + additions, 1)
              p.write_text(s)
              print('Public demo settings restored.')
          else:
              print('Public demo settings already present.')
          PY

      - name: Verify affected backend modules
        run: |
          python -m compileall -q backend/app/core/config.py
          python -m compileall -q backend/app/api/routes/demo_chat.py
          PYTHONPATH=backend python - <<'PY'
          from app.core.config import Settings
          s = Settings()
          assert s.PUBLIC_DEMO_CHAT_ENABLED is True
          assert s.PUBLIC_DEMO_CHAT_LIMIT == 5
          assert s.PUBLIC_DEMO_CHAT_TTL_HOURS == 24
          print('Public demo config verification passed.')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-demo-chat-config.yml
          git add backend/app/core/config.py .github/workflows/fix-demo-chat-config.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: restore public demo chat configuration'
          git push origin main
