name: Apply chat latency and concurrency fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-chat:
    if: "!contains(github.event.head_commit.message, '[chat-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/fix_chat_latency_and_concurrency.py

      - name: Commit patched files
        run: |
          git config user.name "Auto-AI Bot"
          git config user.email "actions@github.com"
          git add frontend/src/components/chat/ChatPage.tsx frontend/src/main.tsx frontend/src/styles/chatResponseLayoutFix.css
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: instant chat bubbles and parallel generations [chat-fix-applied]"
          git push
