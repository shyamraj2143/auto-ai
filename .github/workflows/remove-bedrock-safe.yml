name: Remove Bedrock safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove provider references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_ext = {'.py','.ts','.tsx','.js','.jsx','.json','.md','.yml','.yaml','.txt','.toml','.ini','.xml'}

          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              if 'bedrock' in p.name.lower() and p.name != 'remove-bedrock-safe.yml':
                  p.unlink()
                  continue
              if p.suffix.lower() not in text_ext and p.name != '.env.example':
                  continue
              try: s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              original = s

              if p.as_posix() == 'backend/app/core/config.py':
                  s = '\n'.join(line for line in s.splitlines() if 'BEDROCK_' not in line and 'bedrock_' not in line and 'BEDROCK' not in line)

              # Remove Bedrock-only Python branches/functions without touching neighboring code.
              s = re.sub(r'(?ms)^    @staticmethod\n    def _discover_bedrock\(\).*?(?=^    @staticmethod\n|^    def |^\n)', '', s)
              s = re.sub(r'(?ms)^        if selected_provider == ["\']bedrock["\']:\n(?:^            .*\n)*', '', s)
              s = re.sub(r'(?ms)^        if provider == ["\']bedrock["\']:\n(?:^            .*\n)*', '', s)
              s = re.sub(r'(?ms)^        if call\.provider == ["\']bedrock["\']:\n(?:^            .*\n)*', '', s)
              s = re.sub(r'(?ms)^    if selected_provider == ["\']bedrock["\']:\n(?:^        .*\n)*', '', s)

              # Provider collections and explicit fallback arguments.
              s = s.replace('allow_bedrock_fallback=False,', '').replace('allow_bedrock_fallback=True,', '')
              s = re.sub(r'([,{\[]\s*)["\']bedrock["\']\s*,', r'\1', s)
              s = re.sub(r',\s*["\']bedrock["\']([}\]])', r'\1', s)
              s = s.replace('frozenset({"groq", "bedrock"})', 'frozenset({"groq"})')
              s = s.replace('frozenset({"bedrock", "groq"})', 'frozenset({"groq"})')
              s = s.replace('provider="bedrock"', 'provider="groq"')
              s = s.replace('provider == "bedrock"', 'False')
              s = s.replace('provider in {"groq", "bedrock"}', 'provider in {"groq"}')
              s = s.replace('provider in {"bedrock", "groq"}', 'provider in {"groq"}')
              s = s.replace('("groq", "bedrock")', '("groq",)')
              s = s.replace('["groq", "bedrock"]', '["groq"]')
              s = s.replace('["bedrock", "groq"]', '["groq"]')
              s = re.sub(r'(?m)^\s*"bedrock":\s*\{.*\},?\s*$', '', s)
              s = re.sub(r'(?m)^\s*"bedrock":\s*\[[^\n]*\],?\s*$', '', s)

              # Remove documentation/test-only lines mentioning Bedrock.
              if p.suffix.lower() in {'.md','.txt','.yml','.yaml','.xml'} or p.name == '.env.example':
                  s = '\n'.join(line for line in s.splitlines() if 'bedrock' not in line.lower())

              if s != original:
                  p.write_text(s.rstrip() + '\n', encoding='utf-8')

          # Remove now-obsolete provider-specific tests.
          for p in root.rglob('*bedrock*'):
              if p.is_file() and '.git' not in p.parts:
                  p.unlink()
          PY

          rm -f .github/workflows/remove-bedrock-safe.yml
          python -m compileall -q backend/app
          npm ci --prefix frontend
          npm run build --prefix frontend
          if grep -RniE 'bedrock|BEDROCK_|allow_bedrock_fallback|aws4-hmac-sha256' backend frontend .env.example README.md docs 2>/dev/null; then
            echo 'Residual Bedrock references remain.'
            exit 1
          fi
          git config user.name 'AutoAI Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: remove remaining Bedrock references'
          git push origin HEAD:main
