name: Apply requested user feature fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/apply_user_requested_feature_fixes.py"
      - "scripts/fix_requested_feature_contract_test.py"
      - "scripts/remove_bedrock.py"
      - ".github/workflows/apply-requested-feature-fixes.yml"
      - ".github/feature-fix-trigger.txt"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply_user_requested_feature_fixes.py"
      - "scripts/fix_requested_feature_contract_test.py"
      - "scripts/remove_bedrock.py"
      - ".github/workflows/apply-requested-feature-fixes.yml"
      - ".github/feature-fix-trigger.txt"

permissions:
  contents: write

concurrency:
  group: apply-requested-user-feature-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove Bedrock integration
        run: python scripts/remove_bedrock.py

      - name: Apply targeted patch
        shell: bash
        run: |
          if test -f frontend/src/styles/featureFixes.css && grep -q 'Response language' frontend/src/components/chat/ChatPage.tsx; then
            echo "Targeted patch is already applied."
          else
            python scripts/apply_user_requested_feature_fixes.py
          fi
          python scripts/fix_requested_feature_contract_test.py

      - name: Assert admin section is untouched
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -E '(^|/)admin(/|$)|(^|/)Admin[^/]*\.(tsx|ts|jsx|js|py)$'; then
            echo "Admin-related files were changed. Aborting."
            exit 1
          fi

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused frontend contract test
        run: npm --prefix frontend test -- src/reliability/requestedFeatureFixes.contract.test.ts

      - name: Build frontend
        run: npm run build

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Compile affected backend modules
        run: |
          python -m compileall -q backend/app/services/live_context.py
          python -m compileall -q backend/app/api/routes/ai.py
          python -m compileall -q backend/app/services/groq_service.py
          python -m compileall -q backend/app/services/orchestration/model_registry.py
          python -m compileall -q backend/app/services/orchestration/preset_policy.py

      - name: Run response-language backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_response_language_context.py

      - name: Verify generated files
        shell: bash
        run: |
          test -f frontend/src/styles/featureFixes.css
          grep -q 'Response language' frontend/src/components/chat/ChatPage.tsx
          grep -q 'ss-dock-compact' frontend/src/features/screenShare/ScreenShareOverlay.tsx
          grep -q 'AutoAI app details' frontend/src/components/settings/SettingsPage.tsx
          grep -q 'autoai-response-' backend/app/services/live_context.py
          if grep -RniE 'bedrock|BEDROCK_|allow_bedrock_fallback|aws4-hmac-sha256' backend frontend scripts .env.example README.md docs 2>/dev/null; then
            echo "Bedrock references remain."
            exit 1
          fi
          git diff --check

      - name: Commit verified changes to source branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          target_branch="${GITHUB_HEAD_REF:-main}"
          git config user.name "AutoAI Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove Bedrock integration"
          git push origin HEAD:"$target_branch"
