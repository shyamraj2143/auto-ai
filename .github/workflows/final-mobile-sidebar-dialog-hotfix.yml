name: Final mobile sidebar and dialog hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Apply final deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          styles_path = "android/app/src/main/res/values/styles.xml"
          old_launch = '''    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
              </style>

              <!-- Isolates updater views from the splash theme's full-screen background drawable. -->'''
          new_launch = '''    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>

              <!-- Native fallback for any remaining JavaScript confirm. Never inherit the splash drawable. -->
              <style name="AutoAiWebDialogTheme" parent="@android:style/Theme.Material.Dialog.Alert">
                  <item name="android:windowBackground">@color/autoai_window_background</item>
                  <item name="android:background">@color/autoai_window_background</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowIsFloating">true</item>
                  <item name="android:colorAccent">@color/colorAccent</item>
                  <item name="android:textColorPrimary">@android:color/white</item>
                  <item name="android:textColorSecondary">#B7C5D9</item>
              </style>

              <!-- Isolates updater views from the splash theme's full-screen background drawable. -->'''
          replace_once(styles_path, old_launch, new_launch, "launch theme")

          main_path = "android/app/src/main/java/com/autoai/app/MainActivity.java"
          replace_once(
              main_path,
              'import android.webkit.CookieManager;\nimport android.webkit.WebResourceRequest;',
              'import android.webkit.CookieManager;\nimport android.webkit.JsResult;\nimport android.webkit.WebResourceRequest;',
              "JsResult import",
          )

          chrome_old = '''    private class AutoAiWebChromeClient extends BridgeWebChromeClient {
                  AutoAiWebChromeClient(Bridge bridge) {
                      super(bridge);
                  }

                  @Override
                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {'''
          chrome_new = '''    private class AutoAiWebChromeClient extends BridgeWebChromeClient {
                  AutoAiWebChromeClient(Bridge bridge) {
                      super(bridge);
                  }

                  @Override
                  public boolean onJsConfirm(WebView view, String url, String message, JsResult result) {
                      AtomicBoolean resolved = new AtomicBoolean(false);
                      AlertDialog dialog = new AlertDialog.Builder(MainActivity.this, R.style.AutoAiWebDialogTheme)
                          .setTitle("Auto-AI")
                          .setMessage(message == null ? "" : message)
                          .setPositiveButton(android.R.string.ok, (currentDialog, which) -> {
                              if (resolved.compareAndSet(false, true)) result.confirm();
                          })
                          .setNegativeButton(android.R.string.cancel, (currentDialog, which) -> {
                              if (resolved.compareAndSet(false, true)) result.cancel();
                          })
                          .setOnCancelListener(currentDialog -> {
                              if (resolved.compareAndSet(false, true)) result.cancel();
                          })
                          .create();
                      dialog.setOnDismissListener(currentDialog -> {
                          if (resolved.compareAndSet(false, true)) result.cancel();
                      });
                      dialog.show();
                      return true;
                  }

                  @Override
                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {'''
          replace_once(main_path, chrome_old, chrome_new, "WebChromeClient confirm fallback")

          shell_path = Path("frontend/src/components/layout/AppShell.tsx")
          shell = shell_path.read_text(encoding="utf-8")
          shell_pattern = re.compile(
              r"  const \{\s*closeSidebar,\s*expandSidebar,\s*isSidebarCollapsed\s*\} = useShell\(\);",
              re.MULTILINE,
          )
          shell_replacement = '''  const {
              closeSidebar,
              expandSidebar,
              isSidebarCollapsed,
              isSidebarOpen
            } = useShell();'''
          shell, count = shell_pattern.subn(shell_replacement, shell, count=1)
          if count != 1:
              raise RuntimeError(f"AppShell sidebar state: expected one regex match, found {count}")
          if shell.count('<div className="app-shell">') != 1:
              raise RuntimeError("AppShell open class insertion point was not found exactly once")
          shell = shell.replace(
              '<div className="app-shell">',
              '<div className={`app-shell${isSidebarOpen ? " sidebar-open" : ""}`}>',
              1,
          )
          shell_path.write_text(shell, encoding="utf-8")

          css_path = Path("frontend/src/styles/index.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* FINAL_MOBILE_SIDEBAR_LAYER_FIX */"
          if marker not in css:
              css += r'''

          /* FINAL_MOBILE_SIDEBAR_LAYER_FIX */
          @media (max-width: 767px) {
            .app-shell.sidebar-open .workspace-sidebar[data-open="true"] {
              position: fixed !important;
              inset: 0 auto 0 0 !important;
              z-index: 2147483000 !important;
              height: 100dvh !important;
              max-height: 100dvh !important;
              transform: translate3d(0, 0, 0) !important;
              isolation: isolate;
              overflow: hidden;
            }

            .app-shell.sidebar-open .workspace-sidebar[data-open="true"] > nav {
              min-height: 0 !important;
              flex: 1 1 auto !important;
              overflow-y: auto !important;
              overscroll-behavior: contain;
            }

            .app-shell.sidebar-open .workspace-sidebar[data-open="true"] > div:last-child {
              position: relative;
              z-index: 4;
              flex: 0 0 auto;
              padding-bottom: max(12px, calc(var(--safe-bottom) + 8px));
            }

            .app-shell.sidebar-open .autoai-mobile-nav {
              z-index: 80 !important;
              pointer-events: none !important;
              user-select: none;
            }
          }
          '''
              css_path.write_text(css, encoding="utf-8")
          PY

      - name: Validate frontend and packaged Android assets
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          AUTO_AI_SKIP_COMPRESSION=1 npm run build
          test -f frontend/dist/index.html
          grep -R -q --include='*.css' 'app-shell.sidebar-open' frontend/dist/assets
          grep -R -q --include='*.css' 'z-index:2147483000' frontend/dist/assets
          grep -R -q --include='*.js' --include='*.css' 'chat-delete-dialog-backdrop' frontend/dist/assets
          grep -R -q --include='*.js' 'Delete chat?' frontend/dist/assets
          if grep -R -q --include='*.js' 'Delete this chat?' frontend/dist/assets; then
            echo 'Old native chat-delete confirmation remains in frontend bundle.' >&2
            exit 1
          fi
          npx cap sync android
          grep -R -q --include='*.css' 'app-shell.sidebar-open' android/app/src/main/assets/public/assets
          grep -R -q --include='*.css' 'z-index:2147483000' android/app/src/main/assets/public/assets
          grep -R -q --include='*.js' --include='*.css' 'chat-delete-dialog-backdrop' android/app/src/main/assets/public/assets
          grep -R -q 'postSplashScreenTheme' android/app/src/main/res/values/styles.xml
          grep -R -q 'AutoAiWebDialogTheme' android/app/src/main/res/values/styles.xml
          grep -R -q 'onJsConfirm' android/app/src/main/java/com/autoai/app/MainActivity.java
          chmod +x android/gradlew
          ./android/gradlew -p android compileDebugJavaWithJavac

      - name: Commit validated patch to main
        shell: bash
        run: |
          rm -f .github/workflows/final-mobile-sidebar-dialog-hotfix.yml
          git config user.name "AutoAI Final Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce sidebar overlay and remove splash-styled JS dialogs [force-update]"
          git push origin HEAD:main
