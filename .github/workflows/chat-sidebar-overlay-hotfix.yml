name: Apply chat sidebar overlay hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply sidebar overlay layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/styles/index.css")
          css = path.read_text(encoding="utf-8")

          old = '''/* CHAT_SIDEBAR_MOBILE_HOTFIX */
          @media (max-width: 767px) {
            .workspace-sidebar {
              bottom: calc(var(--mobile-nav-height) + var(--safe-bottom) + 10px) !important;
              height: auto !important;
              max-height: calc(100dvh - var(--mobile-nav-height) - var(--safe-bottom) - 10px);
              border-bottom-right-radius: 20px;
            }
          }'''

          new = '''/* CHAT_SIDEBAR_MOBILE_HOTFIX */
          @media (max-width: 767px) {
            .workspace-sidebar {
              top: 0 !important;
              bottom: 0 !important;
              height: 100dvh !important;
              max-height: 100dvh !important;
              z-index: 95 !important;
              border-bottom-right-radius: 20px;
              box-shadow: 20px 0 72px rgba(0, 0, 0, 0.58);
            }

            .workspace-sidebar > nav {
              min-height: 0;
              overflow-y: auto;
              overscroll-behavior: contain;
            }

            .workspace-sidebar > div:last-child {
              position: relative;
              z-index: 2;
              flex-shrink: 0;
              padding-bottom: max(12px, calc(var(--safe-bottom) + 8px));
              background: linear-gradient(180deg, rgba(5, 18, 39, 0.92), rgba(3, 10, 24, 0.99));
              box-shadow: 0 -14px 30px rgba(0, 0, 0, 0.22);
            }

            .autoai-mobile-nav {
              z-index: 80;
            }
          }'''

          if old not in css:
              raise RuntimeError("Expected previous mobile sidebar hotfix block was not found")

          path.write_text(css.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate frontend build
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build

      - name: Commit validated fix to main
        shell: bash
        run: |
          rm -f .github/workflows/chat-sidebar-overlay-hotfix.yml
          rm -f .github/chat-sidebar-overlay-trigger.txt
          git config user.name "AutoAI UI Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: overlay AI chat sidebar above mobile navigation"
          git push origin HEAD:main
