name: Urgent native call hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/urgent-call-hotfix.yml

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://auto-ai-production-a6ef.up.railway.app/api/v1
      AUTO_AI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AUTO_AI_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic call fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("frontend/src/features/calls/callFailures.ts").write_text(r'''export type CallFailureCode =
            | "MICROPHONE_PERMISSION_DENIED"
            | "CAMERA_PERMISSION_DENIED"
            | "CALL_PERMISSION_REQUIRED"
            | "FOREGROUND_SERVICE_PERMISSION_DENIED"
            | "FOREGROUND_SERVICE_START_NOT_ALLOWED"
            | "FOREGROUND_SERVICE_TYPE_MISSING"
            | "FOREGROUND_NOTIFICATION_FAILED"
            | "FOREGROUND_SERVICE_TIMEOUT"
            | "SERVICE_READY_TIMEOUT"
            | "AUDIO_FOCUS_FAILED"
            | "SIGNALING_AUTH_FAILED"
            | "SIGNALING_TIMEOUT"
            | "OFFER_NOT_RECEIVED"
            | "TURN_AUTH_FAILED"
            | "TURN_UNREACHABLE"
            | "ICE_CONNECTION_FAILED"
            | "MEDIA_CONNECT_TIMEOUT"
            | "NETWORK_LOST"
            | "BACKEND_ACCEPT_FAILED"
            | "CALL_STATE_CONFLICT"
            | "INTERNAL_CALL_ERROR"
            | "FOREGROUND_SERVICE_FAILED";

          export type CallFailurePresentation = {
            title: string;
            message: string;
            diagnostic?: string;
          };

          const OFFLINE_MESSAGE = "No internet connection. Turn on mobile data or Wi-Fi, then retry.";

          function isOffline() {
            return typeof navigator !== "undefined" && navigator.onLine === false;
          }

          function explicitFailureCode(error: unknown): string {
            const seen = new Set<unknown>();
            const queue: unknown[] = [error];
            while (queue.length) {
              const current = queue.shift();
              if (!current || seen.has(current)) continue;
              seen.add(current);
              if (typeof current === "string") {
                const match = current.match(/\b[A-Z][A-Z0-9_]{2,}\b/);
                if (match) return match[0];
                continue;
              }
              if (typeof current !== "object") continue;
              const record = current as Record<string, unknown>;
              for (const key of ["code", "errorCode", "failureCode"]) {
                const value = record[key];
                if (typeof value === "string" && /^[A-Z][A-Z0-9_]{2,}$/.test(value)) return value;
              }
              if (typeof record.message === "string") {
                const match = record.message.match(/\b[A-Z][A-Z0-9_]{2,}\b/);
                if (match) return match[0];
              }
              queue.push(record.cause, record.originalError, record.error);
            }
            return "";
          }

          function presentationFor(codeOrMessage: string): CallFailurePresentation | null {
            const value = codeOrMessage.toUpperCase();
            if (/MICROPHONE_PERMISSION_DENIED|CALL_PERMISSION_REQUIRED/.test(value)) {
              return { title: "Microphone permission required", message: "Allow microphone access in Android Settings, then retry the call." };
            }
            if (/CAMERA_PERMISSION_DENIED/.test(value)) {
              return { title: "Camera permission required", message: "Allow camera access for video calling, or answer using audio only." };
            }
            if (/FOREGROUND_SERVICE_PERMISSION_DENIED/.test(value)) {
              return { title: "Calling permission blocked", message: "Android blocked a required call permission. Open AutoAI app settings and allow microphone and camera access." };
            }
            if (/FOREGROUND_SERVICE_START_NOT_ALLOWED/.test(value)) {
              return { title: "Android blocked the call service", message: "Keep AutoAI visible and retry. Also allow background activity and call notifications in Android Settings." };
            }
            if (/FOREGROUND_SERVICE_TYPE_MISSING/.test(value)) {
              return { title: "Calling service configuration error", message: "This app build cannot start the required call service. Install the latest AutoAI update." };
            }
            if (/FOREGROUND_NOTIFICATION_FAILED/.test(value)) {
              return { title: "Call notification unavailable", message: "Allow AutoAI call notifications in Android Settings, then retry." };
            }
            if (/SERVICE_READY_TIMEOUT|FOREGROUND_SERVICE_TIMEOUT/.test(value)) {
              return { title: "Calling service timed out", message: "Android did not start the calling service in time. Close the failed call and retry once." };
            }
            if (/AUDIO_FOCUS_FAILED/.test(value)) {
              return { title: "Audio is busy", message: "Another app is using call audio. Close the other call or recorder and retry." };
            }
            if (/SIGNALING_AUTH_FAILED/.test(value)) {
              return { title: "Call session expired", message: "Your secure call session expired. Reopen AutoAI and retry." };
            }
            if (/SIGNALING_TIMEOUT|OFFER_NOT_RECEIVED|SIGNALING UNAVAILABLE/.test(value)) {
              return { title: "Secure signaling unavailable", message: "AutoAI could not establish the secure call channel. Check the connection and retry." };
            }
            if (/TURN_AUTH_FAILED|TURN_UNREACHABLE|RELAY/.test(value)) {
              return { title: "Call relay unavailable", message: "The media relay could not be reached. Retry after changing between Wi-Fi and mobile data." };
            }
            if (/ICE_CONNECTION_FAILED|MEDIA_CONNECT_TIMEOUT/.test(value)) {
              return { title: "Media connection failed", message: "The call reached the other user, but audio or video could not connect. Retry on a stable network." };
            }
            if (/NETWORK_LOST|NETWORK_UNAVAILABLE|NO INTERNET|OFFLINE/.test(value)) {
              return { title: "No internet connection", message: OFFLINE_MESSAGE };
            }
            if (/BACKEND_ACCEPT_FAILED/.test(value)) {
              return { title: "Call could not be accepted", message: "The server could not confirm the answer action. Check the network and retry before the call expires." };
            }
            if (/CALL_STATE_CONFLICT/.test(value)) {
              return { title: "Call is no longer available", message: "This call was already ended, rejected, or answered on another device." };
            }
            return null;
          }

          export class CallSetupError extends Error {
            readonly code: CallFailureCode;
            readonly cause?: unknown;

            constructor(code: CallFailureCode, message: string, cause?: unknown) {
              const nestedCode = explicitFailureCode(cause);
              const exact = presentationFor(nestedCode || code);
              super(exact?.message ?? message);
              this.name = "CallSetupError";
              this.code = (nestedCode || code) as CallFailureCode;
              this.cause = cause;
            }
          }

          export function failureCodeOf(error: unknown, fallback: CallFailureCode = "INTERNAL_CALL_ERROR") {
            const nestedCode = explicitFailureCode(error);
            if (nestedCode) return nestedCode as CallFailureCode;
            if (error instanceof CallSetupError) return error.code;
            return fallback;
          }

          export function callFailurePresentation(error: string, includeDiagnostic = false): CallFailurePresentation {
            const normalized = error.trim();
            if (isOffline()) return { title: "No internet connection", message: OFFLINE_MESSAGE };
            const exact = presentationFor(normalized);
            if (exact) return includeDiagnostic && normalized ? { ...exact, diagnostic: normalized } : exact;
            const fallback: CallFailurePresentation = {
              title: "Calling service could not start",
              message: normalized || "AutoAI could not prepare the call. Please retry.",
            };
            return includeDiagnostic && normalized ? { ...fallback, diagnostic: normalized } : fallback;
          }
          ''', encoding="utf-8")

          Path("frontend/src/components/common/AppNotice.tsx").write_text(r'''import { useEffect, useState } from "react";
          import { AlertTriangle, Info, X } from "lucide-react";
          import clsx from "clsx";

          type AppNoticeProps = {
            message: string;
            kind?: "info" | "error";
            onRetry?: () => void;
            onDismiss?: () => void;
          };

          const OFFLINE_MESSAGE = "No internet connection. Turn on mobile data or Wi-Fi, then retry.";

          export function AppNotice({ message, kind = "info", onRetry, onDismiss }: AppNoticeProps) {
            const [online, setOnline] = useState(() => typeof navigator === "undefined" || navigator.onLine);

            useEffect(() => {
              const markOnline = () => setOnline(true);
              const markOffline = () => setOnline(false);
              window.addEventListener("online", markOnline);
              window.addEventListener("offline", markOffline);
              return () => {
                window.removeEventListener("online", markOnline);
                window.removeEventListener("offline", markOffline);
              };
            }, []);

            const visibleMessage = kind === "error" && !online ? OFFLINE_MESSAGE : message;
            return (
              <div className={clsx("app-notice", `app-notice-${kind}`)} role={kind === "error" ? "alert" : "status"} aria-live={kind === "error" ? "assertive" : "polite"}>
                {kind === "error" ? <AlertTriangle size={16} /> : <Info size={16} />}
                <span>{visibleMessage}</span>
                {onRetry && <button type="button" onClick={onRetry}>Retry</button>}
                {onDismiss && <button type="button" className="app-notice-dismiss" onClick={onDismiss} aria-label="Dismiss notice"><X size={14} /></button>}
              </div>
            );
          }
          ''', encoding="utf-8")

          Path("android/app/src/main/java/com/autoai/app/CallFailureMessages.java").write_text(r'''package com.autoai.app;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;

          final class CallFailureMessages {
              private CallFailureMessages() {}

              static boolean isOnline(Context context) {
                  ConnectivityManager manager = (ConnectivityManager) context.getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (manager == null) return false;
                  Network network = manager.getActiveNetwork();
                  if (network == null) return false;
                  NetworkCapabilities capabilities = manager.getNetworkCapabilities(network);
                  return capabilities != null
                      && capabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      && capabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED);
              }

              static String message(Context context, String code) {
                  if (!isOnline(context) || "NETWORK_LOST".equals(code)) {
                      return "No internet connection. Turn on mobile data or Wi-Fi, then retry.";
                  }
                  if (code == null) return "AutoAI could not prepare the call. Please retry.";
                  switch (code) {
                      case "MICROPHONE_PERMISSION_DENIED":
                      case "CALL_PERMISSION_REQUIRED":
                          return "Microphone permission is required. Allow it in Android Settings, then retry.";
                      case "CAMERA_PERMISSION_DENIED":
                          return "Camera permission is required for video. Allow it, or answer using audio only.";
                      case "FOREGROUND_SERVICE_PERMISSION_DENIED":
                          return "Android blocked a required calling permission. Allow microphone and camera access, then retry.";
                      case "FOREGROUND_SERVICE_START_NOT_ALLOWED":
                          return "Android blocked the call service. Keep AutoAI visible and allow background activity, then retry.";
                      case "FOREGROUND_SERVICE_TYPE_MISSING":
                          return "This AutoAI build has an invalid calling-service configuration. Install the latest update.";
                      case "FOREGROUND_NOTIFICATION_FAILED":
                          return "Call notifications are blocked. Allow AutoAI call notifications, then retry.";
                      case "SERVICE_READY_TIMEOUT":
                      case "FOREGROUND_SERVICE_TIMEOUT":
                          return "The Android calling service timed out. Close this screen and retry once.";
                      case "SIGNALING_AUTH_FAILED":
                          return "The secure call session expired. Reopen AutoAI and retry.";
                      case "SIGNALING_TIMEOUT":
                      case "OFFER_NOT_RECEIVED":
                          return "Secure call signaling is unavailable. Check the network and retry.";
                      case "TURN_AUTH_FAILED":
                      case "TURN_UNREACHABLE":
                          return "The call relay is unavailable. Change between Wi-Fi and mobile data, then retry.";
                      case "ICE_CONNECTION_FAILED":
                      case "MEDIA_CONNECT_TIMEOUT":
                          return "Audio or video could not connect. Retry on a stable network.";
                      case "BACKEND_ACCEPT_FAILED":
                          return "The server could not accept this call. Check the network and retry before it expires.";
                      case "CALL_STATE_CONFLICT":
                          return "This call has already ended or was answered on another device.";
                      case "AUDIO_FOCUS_FAILED":
                          return "Another app is using call audio. Close the other call or recorder, then retry.";
                      default:
                          return "AutoAI could not prepare the call. Please retry. Error: " + code;
                  }
              }
          }
          ''', encoding="utf-8")

