          replace_once(service,
          '''                int serviceType = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                              serviceType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_PHONE_CALL;
