      - name: Prepare optional Firebase config
        shell: bash
        run: |
          if [ -n "${AUTO_AI_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$AUTO_AI_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Validate frontend and Android compilation
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          VITE_API_URL="$VITE_API_URL" npm run build
          chmod +x android/gradlew
          ./android/gradlew -p android compileDebugJavaWithJavac

      - name: Commit validated hotfix to main
        shell: bash
        run: |
          rm -f .github/workflows/urgent-call-hotfix.yml
          git config user.name "AutoAI Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Android audio and video calls"
          git push origin HEAD:main
