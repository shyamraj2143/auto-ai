name: Coding preset check

on:
  push:
    branches:
      - main
    paths:
      - "backend/app/services/orchestration/**"
      - "backend/tests/test_coding_preset_fallback.py"
      - "backend/tests/test_intelligence_orchestration.py"
      - ".github/workflows/coding-preset-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Compile orchestration modules
        run: python -m compileall -q backend/app/services/orchestration

      - name: Run focused coding preset tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q backend/tests/test_coding_preset_fallback.py
          pytest -q backend/tests/test_intelligence_orchestration.py -k coding
