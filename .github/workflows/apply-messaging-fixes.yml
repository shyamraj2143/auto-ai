name: Apply messaging and offline fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Triggered again to apply the already-reviewed messaging/offline implementation.
jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply fixes
        run: |
          python scripts/apply_messaging_offline_fixes.py
          python scripts/apply_message_thread_layout_fix.py

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes were produced.'
            exit 0
          fi
          git commit -m 'fix: messaging notifications offline mode and attachment previews'
          git push origin HEAD:main
