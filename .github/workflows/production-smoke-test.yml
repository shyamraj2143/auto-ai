name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify production API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      API_BASE_URL: https://auto-ai-app-download.up.railway.app/api/v1
      AUTO_AI_ADMIN_EMAIL: ${{ secrets.AUTO_AI_ADMIN_EMAIL }}
      AUTO_AI_ADMIN_PASSWORD: ${{ secrets.AUTO_AI_ADMIN_PASSWORD }}

    steps:
      - name: Wait for backend health and database readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            health="$(curl -fsS --max-time 10 "$API_BASE_URL/health" 2>/dev/null || true)"
            ready="$(curl -fsS --max-time 10 "$API_BASE_URL/ready" 2>/dev/null || true)"
            echo "health=$health"
            echo "ready=$ready"
            if printf '%s' "$health" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' && printf '%s' "$ready" | grep -q '"status"[[:space:]]*:[[:space:]]*"ready"'; then
              exit 0
            fi
            echo "Production backend is not ready yet (attempt $attempt/20)."
            sleep 15
          done
          echo 'Production backend did not become healthy and database-ready.' >&2
          exit 1

      - name: Verify admin login
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AUTO_AI_ADMIN_EMAIL"
          test -n "$AUTO_AI_ADMIN_PASSWORD"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({"email": os.environ["AUTO_AI_ADMIN_EMAIL"], "password": os.environ["AUTO_AI_ADMIN_PASSWORD"]}))
          PY
          )"
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 30 -o "$response_file" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST "$API_BASE_URL/auth/login" \
            --data "$payload")"
          echo "Login HTTP status: $status"
          if [ "$status" != "200" ]; then
            cat "$response_file"
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if not data.get('access_token'):
              raise SystemExit('Login response does not contain access_token')
          print('Production login smoke test passed.')
          PY
