name: Validate mobile chat sidebar hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          sidebar_path = Path("frontend/src/components/layout/Sidebar.tsx")
          sidebar = sidebar_path.read_text(encoding="utf-8")

          state_old = '  const [query, setQuery] = useState("");\n  const [isAccountMenuOpen, setIsAccountMenuOpen] = useState(false);'
          state_new = '  const [query, setQuery] = useState("");\n  const [pendingDeleteChat, setPendingDeleteChat] = useState<{ id: string; title: string } | null>(null);\n  const [deletingChat, setDeletingChat] = useState(false);\n  const [isAccountMenuOpen, setIsAccountMenuOpen] = useState(false);'
          if sidebar.count(state_old) != 1:
              raise RuntimeError("Unable to locate Sidebar state insertion point")
          sidebar = sidebar.replace(state_old, state_new, 1)

          remove_old = '  async function removeChat(id: string) {\n    if (window.confirm("Delete this chat?")) {\n      await deleteChat(id);\n    }\n  }'
          remove_new = '  function removeChat(id: string, title: string) {\n    setPendingDeleteChat({ id, title });\n  }\n\n  async function confirmRemoveChat() {\n    if (!pendingDeleteChat || deletingChat) return;\n    setDeletingChat(true);\n    try {\n      await deleteChat(pendingDeleteChat.id);\n      setPendingDeleteChat(null);\n    } finally {\n      setDeletingChat(false);\n    }\n  }'
          if sidebar.count(remove_old) != 1:
              raise RuntimeError("Unable to locate Sidebar delete handler")
          sidebar = sidebar.replace(remove_old, remove_new, 1)

          click_old = 'onClick={() => removeChat(chat.id)}'
          click_new = 'onClick={() => removeChat(chat.id, chat.title)}'
          if sidebar.count(click_old) != 1:
              raise RuntimeError("Unable to locate Sidebar delete button")
          sidebar = sidebar.replace(click_old, click_new, 1)

          tail = "      </aside>\n    </>\n  );"
          if sidebar.count(tail) != 1:
              raise RuntimeError("Unable to locate Sidebar render tail")
          dialog_lines = [
              "      </aside>",
              "      {pendingDeleteChat && (",
              "        <div",
              "          className=\"chat-delete-dialog-backdrop\"",
              "          role=\"presentation\"",
              "          onMouseDown={(event) => {",
              "            if (event.target === event.currentTarget && !deletingChat) setPendingDeleteChat(null);",
              "          }}",
              "        >",
              "          <section",
              "            className=\"chat-delete-dialog\"",
              "            role=\"alertdialog\"",
              "            aria-modal=\"true\"",
              "            aria-labelledby=\"chat-delete-dialog-title\"",
              "            aria-describedby=\"chat-delete-dialog-description\"",
              "          >",
              "            <span className=\"chat-delete-dialog-icon\" aria-hidden=\"true\">",
              "              <Trash2 size={20} />",
              "            </span>",
              "            <div className=\"min-w-0\">",
              "              <h2 id=\"chat-delete-dialog-title\">Delete chat?</h2>",
              "              <p id=\"chat-delete-dialog-description\">“{pendingDeleteChat.title}” will be permanently deleted.</p>",
              "            </div>",
              "            <div className=\"chat-delete-dialog-actions\">",
              "              <button",
              "                className=\"chat-delete-dialog-cancel\"",
              "                disabled={deletingChat}",
              "                onClick={() => setPendingDeleteChat(null)}",
              "                type=\"button\"",
              "              >",
              "                Cancel",
              "              </button>",
              "              <button",
              "                className=\"chat-delete-dialog-confirm\"",
              "                disabled={deletingChat}",
              "                onClick={() => void confirmRemoveChat()}",
              "                type=\"button\"",
              "              >",
              "                {deletingChat ? \"Deleting…\" : \"Delete chat\"}",
              "              </button>",
              "            </div>",
              "          </section>",
              "        </div>",
              "      )}",
              "    </>",
              "  );",
          ]
          sidebar = sidebar.replace(tail, "\n".join(dialog_lines), 1)
          sidebar_path.write_text(sidebar, encoding="utf-8")

          css_path = Path("frontend/src/styles/index.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* CHAT_SIDEBAR_MOBILE_HOTFIX */"
          if marker not in css:
              css += textwrap.dedent(r'''

              /* CHAT_SIDEBAR_MOBILE_HOTFIX */
              @media (max-width: 767px) {
                .workspace-sidebar {
                  bottom: calc(var(--mobile-nav-height) + var(--safe-bottom) + 10px) !important;
                  height: auto !important;
                  max-height: calc(100dvh - var(--mobile-nav-height) - var(--safe-bottom) - 10px);
                  border-bottom-right-radius: 20px;
                }
              }

              .chat-delete-dialog-backdrop {
                position: fixed;
                inset: 0;
                z-index: 140;
                display: grid;
                place-items: center;
                padding: max(18px, var(--safe-top)) max(18px, var(--safe-right)) max(18px, var(--safe-bottom)) max(18px, var(--safe-left));
                background: rgba(1, 7, 20, 0.76);
                backdrop-filter: blur(14px);
              }

              .chat-delete-dialog {
                display: grid;
                width: min(100%, 360px);
                grid-template-columns: 44px minmax(0, 1fr);
                gap: 12px;
                padding: 18px;
                color: #f8fbff;
                border: 1px solid rgba(255, 103, 126, 0.34);
                border-radius: 18px;
                background: linear-gradient(145deg, rgba(22, 20, 48, 0.98), rgba(5, 15, 34, 0.98));
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.58), 0 0 32px rgba(255, 77, 103, 0.1);
              }

              .chat-delete-dialog-icon {
                display: grid;
                width: 44px;
                height: 44px;
                place-items: center;
                color: #ff8093;
                border: 1px solid rgba(255, 103, 126, 0.3);
                border-radius: 13px;
                background: rgba(255, 77, 103, 0.11);
              }

              .chat-delete-dialog h2 {
                margin: 1px 0 6px;
                font-size: 16px;
                font-weight: 750;
              }

              .chat-delete-dialog p {
                margin: 0;
                overflow-wrap: anywhere;
                color: #aebed4;
                font-size: 13px;
                line-height: 1.5;
              }

              .chat-delete-dialog-actions {
                grid-column: 1 / -1;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 6px;
              }

              .chat-delete-dialog-actions button {
                min-height: 42px;
                border-radius: 12px;
                font-size: 13px;
                font-weight: 750;
              }

              .chat-delete-dialog-cancel {
                color: #c9d6e8;
                border: 1px solid rgba(143, 166, 202, 0.25);
                background: rgba(255, 255, 255, 0.05);
              }

              .chat-delete-dialog-confirm {
                color: #fff;
                border: 1px solid rgba(255, 122, 143, 0.38);
                background: linear-gradient(135deg, #c82f4a, #ff4d67);
                box-shadow: 0 9px 24px rgba(255, 77, 103, 0.2);
              }
              ''')
              css_path.write_text(css, encoding="utf-8")
          PY

      - name: Validate frontend build
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build

      - name: Commit validated fix to main
        shell: bash
        run: |
          rm -f .github/workflows/chat-sidebar-mobile-hotfix-pr.yml
          git config user.name "AutoAI UI Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep chat sidebar above mobile navigation"
          git push origin HEAD:main
