name: AutoAI Seva Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/api/routes/service_applications.py"
      - "backend/app/main.py"
      - "backend/app/models/autoai_seva.py"
      - "backend/app/models/form_service.py"
      - "backend/app/models/__init__.py"
      - "backend/app/services/autoai_seva_*.py"
      - "backend/app/services/form_service_*.py"
      - "backend/tests/test_autoai_seva*.py"
      - "backend/tests/test_form_service*.py"
      - "frontend/src/features/autoaiSeva/**"
      - "frontend/src/features/actionHub/**"
      - "frontend/src/components/layout/WorkspaceNavigation.tsx"
      - "frontend/src/App.tsx"
      - ".github/workflows/autoai-seva-validation.yml"

permissions:
  contents: write

concurrency:
  group: autoai-seva-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-seva-tests:
    name: Backend Seva tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      ENVIRONMENT: test
      DB_BACKEND: sqlite
      SQLITE_PATH: /tmp/autoai-seva-validation.db
      SECRET_KEY: autoai-seva-ci-secret-key
      JWT_SECRET_KEY: autoai-seva-ci-jwt-secret-key
      CALL_FEATURE_ENABLED: "false"
      RELATIONSHIP_FOLLOWUP_WORKER_ENABLED: "false"
      FCM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile Seva modules
        run: |
          python -m py_compile \
            app/api/routes/service_applications.py \
            app/models/autoai_seva.py \
            app/services/autoai_seva_conflicts.py \
            app/services/autoai_seva_review.py \
            app/services/autoai_seva_seed.py \
            app/services/form_service_adapters.py \
            app/services/form_service_gateway.py \
            app/services/form_service_state.py
      - name: Run Seva and form-service regression tests
        run: |
          pytest -q \
            tests/test_autoai_seva.py \
            tests/test_autoai_seva_security.py \
            tests/test_form_services.py \
            tests/test_form_service_intent_matching.py

  frontend-production-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Run form-service component tests
        run: npm test -- ServiceTaskCard

  record-validation:
    name: Record validation result
    if: always()
    needs: [backend-seva-tests, frontend-production-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write validation status
        env:
          BACKEND_RESULT: ${{ needs.backend-seva-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-production-build.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          backend = os.environ["BACKEND_RESULT"]
          frontend = os.environ["FRONTEND_RESULT"]
          status = "success" if backend == "success" and frontend == "success" else "failure"
          payload = {
              "status": status,
              "backend": backend,
              "frontend": frontend,
              "source_commit": os.environ["SOURCE_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          path = Path(".release-status/seva-validation.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit validation status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/seva-validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record AutoAI Seva validation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
