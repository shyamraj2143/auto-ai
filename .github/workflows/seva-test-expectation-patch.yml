name: Patch Seva Test Expectation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seva-test-expectation-patch.yml"

permissions:
  contents: write

concurrency:
  group: seva-test-expectation-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update authoritative active-card expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_form_services.py")
          content = path.read_text(encoding="utf-8")
          old = 'assert client.get(f"/api/v1/form-services/tasks/{task_id}").json()["active_card"]["type"] == "service_plan"'
          new = 'assert client.get(f"/api/v1/form-services/tasks/{task_id}").json()["active_card"]["type"] == "information_request"'
          if old not in content:
              raise SystemExit("Expected legacy assertion was not found")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/seva-test-expectation-patch.yml
      - name: Commit exact test patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_form_services.py .github/workflows/seva-test-expectation-patch.yml
          git commit -m "test(forms): expect authoritative information request card [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
