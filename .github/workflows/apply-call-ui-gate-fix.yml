name: Apply Android call gate fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-call-ui-gate-fix.yml"
      - "frontend/src/features/calls/CallsTab.tsx"
      - "frontend/src/features/calls/CallProvider.tsx"
      - "frontend/src/features/calls/callStartHistoryHotfix.contract.test.ts"

permissions:
  contents: write

concurrency:
  group: apply-android-call-gate-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          calls_tab_path = Path("frontend/src/features/calls/CallsTab.tsx")
          provider_path = Path("frontend/src/features/calls/CallProvider.tsx")
          contract_path = Path("frontend/src/features/calls/callStartHistoryHotfix.contract.test.ts")

          calls_tab = calls_tab_path.read_text(encoding="utf-8")
          provider = provider_path.read_text(encoding="utf-8")
          contract = contract_path.read_text(encoding="utf-8")

          import_anchor = 'import { callApi } from "./services/callApi";\n'
          import_replacement = import_anchor + 'import { callNative } from "./services/callNative";\n'
          if 'import { callNative } from "./services/callNative";' not in calls_tab:
              if import_anchor not in calls_tab:
                  raise SystemExit("callNative import anchor missing")
              calls_tab = calls_tab.replace(import_anchor, import_replacement, 1)

          new_place = '''  async function placeUserCall(user: PublicCallUser, type: CallType) {
            if ((type === "audio" && !user.can_audio_call) || (type === "video" && !user.can_video_call)) {
              showToast("Follow approval is required before calling this user.");
              return;
            }

            // Android owns signaling and media inside the native foreground service.
            // Requiring the WebView websocket here prevented the real call request
            // from reaching the backend and produced only a red secure-call error.
            if (callNative.isAndroid()) {
              await startCall(user, type);
              return;
            }

            let latestConfig = config;
            if (!latestConfig || !latestConfig.enabled || !latestConfig.realtime_configured || signalingState !== "connected") {
              showToast("Connecting secure call service…");
              try {
                latestConfig = await refreshRealtime();
              } catch (connectError) {
                showToast(errorText(connectError, "Calling service could not connect. Please retry."));
                return;
              }
            }
            if (!latestConfig.enabled || !latestConfig.realtime_configured) {
              showToast(latestConfig.diagnostic || "Calling service is temporarily unavailable.");
              return;
            }
            await startCall(user, type);
          }
          '''
          place_pattern = re.compile(
              r'  async function placeUserCall\(user: PublicCallUser, type: CallType\) \{.*?\n  \}\n\n  async function openMessageByUserId',
              re.S,
          )
          calls_tab, count = place_pattern.subn(new_place + '\n  async function openMessageByUserId', calls_tab, count=1)
          if count != 1:
              raise SystemExit(f"placeUserCall replacement count={count}")

          old_offline = '        await cleanup("failed", "User is unavailable");\n'
          new_offline = '        await cleanup("failed", "User is offline or has no internet connection.");\n'
          if old_offline not in provider:
              raise SystemExit("offline delivery anchor missing")
          provider = provider.replace(old_offline, new_offline, 1)

          provider_contract_anchor = 'const callsTabSource = readFileSync(new URL("./CallsTab.tsx", import.meta.url), "utf8");\n'
          provider_contract_replacement = provider_contract_anchor + 'const providerSource = readFileSync(new URL("./CallProvider.tsx", import.meta.url), "utf8");\n'
          if "const providerSource" not in contract:
              if provider_contract_anchor not in contract:
                  raise SystemExit("provider contract import anchor missing")
              contract = contract.replace(provider_contract_anchor, provider_contract_replacement, 1)

          contract_anchor = '  it("keeps the real backend call creation and history endpoints as the source of truth", () => {\n'
          contract_block = '''  it("does not block Android calls on the WebView signaling gate", () => {
            expect(callsTabSource).toContain('import { callNative } from "./services/callNative";');
            expect(callsTabSource).toContain("if (callNative.isAndroid())");
            expect(callsTabSource).toContain("await startCall(user, type);");
            expect(callsTabSource.indexOf("if (callNative.isAndroid())")).toBeLessThan(
              callsTabSource.indexOf('showToast("Connecting secure call service…")'),
            );
          });

          '''
          if "does not block Android calls on the WebView signaling gate" not in contract:
              if contract_anchor not in contract:
                  raise SystemExit("contract insertion anchor missing")
              contract = contract.replace(contract_anchor, contract_block + contract_anchor, 1)

          offline_test_anchor = '  it("refreshes history immediately whenever the Calls section is opened", () => {\n'
          offline_test_block = '''  it("shows a clear offline state only when no delivery channel exists", () => {
            expect(providerSource).toContain("User is offline or has no internet connection.");
            expect(providerSource).toContain('created.delivery === "unreachable"');
          });

          '''
          if "shows a clear offline state only when no delivery channel exists" not in contract:
              if offline_test_anchor not in contract:
                  raise SystemExit("offline contract insertion anchor missing")
              contract = contract.replace(offline_test_anchor, offline_test_block + offline_test_anchor, 1)

          calls_tab_path.write_text(calls_tab, encoding="utf-8")
          provider_path.write_text(provider, encoding="utf-8")
          contract_path.write_text(contract, encoding="utf-8")
          PY

      - name: Verify exact scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          expected="$(printf '%s\n' \
            frontend/src/features/calls/CallProvider.tsx \
            frontend/src/features/calls/CallsTab.tsx \
            frontend/src/features/calls/callStartHistoryHotfix.contract.test.ts | sort)"
          test "$changed" = "$expected"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run focused frontend tests
        run: |
          npm --prefix frontend test -- src/features/calls/callStartHistoryHotfix.contract.test.ts
          npm --prefix frontend test -- src/features/calls/CallsTab.test.ts

      - name: Build production frontend
        env:
          AUTO_AI_SKIP_COMPRESSION: "1"
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend call tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio 'fakeredis[lua]'
          pytest -q backend/tests/test_calls.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android integration
        run: |
          npx cap sync android
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileDebugJavaWithJavac :app:testDebugUnitTest

      - name: Commit verified fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-call-ui-gate-fix.yml
          git diff --check
          git config user.name "AutoAI Call Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/features/calls/CallsTab.tsx \
            frontend/src/features/calls/CallProvider.tsx \
            frontend/src/features/calls/callStartHistoryHotfix.contract.test.ts \
            .github/workflows/apply-call-ui-gate-fix.yml
          git commit -m "fix: start Android voice and video calls without WebView signaling gate [force-update]"
          git push origin HEAD:${{ github.head_ref }}
