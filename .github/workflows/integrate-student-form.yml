name: Remove legacy student-form runtime mount

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/App.tsx"
      - ".github/workflows/integrate-student-form.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate App mount
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/App.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace('import { StudentRegistrationSection } from "./components/landing/StudentRegistrationSection";\n', '')
          text = text.replace('                  <StudentRegistrationSection />\n', '')
          path.write_text(text, encoding="utf-8")
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git diff --cached --quiet || git commit -m "fix: avoid duplicate student registration mount"
          git push
