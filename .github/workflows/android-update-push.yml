name: Push Android update notification

on:
  workflow_run:
    workflows:
      - Android release
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: android-update-push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify-after-release:
    name: Notify registered Android phones
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Keep update notification on the same production backend as the APK.
      AUTO_AI_API_BASE_URL: https://auto-ai-backend.onrender.com/api/v1
      AUTO_AI_ADMIN_EMAIL: ${{ secrets.AUTO_AI_ADMIN_EMAIL }}
      AUTO_AI_ADMIN_PASSWORD: ${{ secrets.AUTO_AI_ADMIN_PASSWORD }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve latest verified Android release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,body,assets)"
          release_tag="$(printf '%s' "$release_json" | jq -r '.tagName // empty')"
          release_body="$(printf '%s' "$release_json" | jq -r '.body // empty')"
          apk_count="$(printf '%s' "$release_json" | jq '[.assets[] | select(.name == "auto-ai.apk")] | length')"
          version_code="$(printf '%s\n' "$release_body" | sed -n 's/^Version-Code:[[:space:]]*//p' | head -1 | tr -d '\r')"
          version_name="$(printf '%s\n' "$release_body" | sed -n 's/^Version-Name:[[:space:]]*//p' | head -1 | tr -d '\r')"
          sha256="$(printf '%s\n' "$release_body" | sed -n 's/^SHA256:[[:space:]]*//p' | head -1 | tr -d '\r')"

          if [ -z "$release_tag" ] || [ "$apk_count" -lt 1 ] || ! [[ "$version_code" =~ ^[0-9]+$ ]] || [ -z "$version_name" ] || ! [[ "$sha256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo 'Latest GitHub release does not contain complete verified AutoAI APK metadata.' >&2
            exit 1
          fi

          echo "AUTO_AI_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "AUTO_AI_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "AUTO_AI_ANDROID_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "Resolved $release_tag ($version_name / $version_code)."

      - name: Dispatch update notification through administrator authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUTO_AI_ADMIN_EMAIL:-}" ] || [ -z "${AUTO_AI_ADMIN_PASSWORD:-}" ]; then
            echo 'Production administrator credentials are missing.' >&2
            exit 1
          fi

          success=0
          for attempt in $(seq 1 20); do
            if python scripts/notify_android_update.py \
              --api-url "$AUTO_AI_API_BASE_URL" \
              --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
              --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
              --changelog "AutoAI ${AUTO_AI_ANDROID_VERSION_NAME} is ready to install."; then
              success=1
              break
            fi
            echo "Phone notification attempt $attempt failed; waiting for the deployed backend..."
            sleep $((attempt < 6 ? 10 : 30))
          done
          test "$success" -eq 1

      - name: Record phone notification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": os.environ.get("NOTIFICATION_JOB_STATUS", "unknown"),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "version_code": os.environ.get("AUTO_AI_ANDROID_VERSION_CODE", ""),
              "version_name": os.environ.get("AUTO_AI_ANDROID_VERSION_NAME", ""),
              "release_tag": os.environ.get("AUTO_AI_ANDROID_RELEASE_TAG", ""),
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          os.makedirs('.release-status', exist_ok=True)
          with open('.release-status/notification.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY

          encoded="$(base64 -w0 .release-status/notification.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json" \
              -f message='chore: record Android notification result [skip ci]' \
              -f content="$encoded" \
              -f sha="$current_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json" \
              -f message='chore: record Android notification result [skip ci]' \
              -f content="$encoded" \
              -f branch=main >/dev/null
          fi
