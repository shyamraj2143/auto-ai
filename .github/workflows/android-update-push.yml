name: Push Android update notification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.release-status/**'
  workflow_dispatch:

concurrency:
  group: android-update-push-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  notify-after-release:
    name: Notify registered Android phones
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AUTO_AI_API_BASE_URL: https://auto-ai-production-a6ef.up.railway.app/api/v1
      AUTO_AI_ADMIN_EMAIL: ${{ secrets.AUTO_AI_ADMIN_EMAIL }}
      AUTO_AI_ADMIN_PASSWORD: ${{ secrets.AUTO_AI_ADMIN_PASSWORD }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Wait for signed APK release from this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 150); do
            encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-status/android.json?ref=main" --jq .content 2>/dev/null || true)"
            if [ -n "$encoded" ]; then
              payload="$(printf '%s' "$encoded" | tr -d '\n' | base64 --decode 2>/dev/null || true)"
              status="$(printf '%s' "$payload" | jq -r '.status // empty' 2>/dev/null || true)"
              source_commit="$(printf '%s' "$payload" | jq -r '.source_commit // empty' 2>/dev/null || true)"
              version_code="$(printf '%s' "$payload" | jq -r '.version_code // empty' 2>/dev/null || true)"
              version_name="$(printf '%s' "$payload" | jq -r '.version_name // empty' 2>/dev/null || true)"
              release_tag="$(printf '%s' "$payload" | jq -r '.release_tag // empty' 2>/dev/null || true)"
              if [ "$status" = "success" ] && [ "$source_commit" = "$EXPECTED_COMMIT" ] && [ -n "$version_code" ] && [ -n "$version_name" ]; then
                echo "AUTO_AI_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
                echo "AUTO_AI_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
                echo "AUTO_AI_ANDROID_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
                matched=1
                break
              fi
              if [ "$status" = "failure" ] && [ "$source_commit" = "$EXPECTED_COMMIT" ]; then
                echo "Android release failed for commit $EXPECTED_COMMIT." >&2
                exit 1
              fi
            fi
            echo "Waiting for signed APK release ($attempt/150)..."
            sleep 10
          done
          test "$matched" -eq 1

      - name: Wait for matching Railway deployment
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          health_url="${AUTO_AI_API_BASE_URL%/}/health"
          ready=0
          for attempt in $(seq 1 12); do
            if python scripts/wait_for_railway_deployment.py \
              --health-url "$health_url" \
              --commit-sha "$EXPECTED_COMMIT"; then
              ready=1
              break
            fi
            echo "Railway is not ready for admin notification fallback ($attempt/12)."
            sleep $((attempt * 10))
          done
          test "$ready" -eq 1

      - name: Dispatch update notification through administrator authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUTO_AI_ADMIN_EMAIL:-}" ] || [ -z "${AUTO_AI_ADMIN_PASSWORD:-}" ]; then
            echo 'Production administrator credentials are missing.' >&2
            exit 1
          fi
          success=0
          for attempt in $(seq 1 12); do
            if python scripts/notify_android_update.py \
              --api-url "$AUTO_AI_API_BASE_URL" \
              --version-code "$AUTO_AI_ANDROID_VERSION_CODE" \
              --version-name "$AUTO_AI_ANDROID_VERSION_NAME" \
              --changelog "AutoAI ${AUTO_AI_ANDROID_VERSION_NAME} is ready to install."; then
              success=1
              break
            fi
            echo "Phone notification attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          test "$success" -eq 1

      - name: Record phone notification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": os.environ.get("NOTIFICATION_JOB_STATUS", "unknown"),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "version_code": os.environ.get("AUTO_AI_ANDROID_VERSION_CODE", ""),
              "version_name": os.environ.get("AUTO_AI_ANDROID_VERSION_NAME", ""),
              "release_tag": os.environ.get("AUTO_AI_ANDROID_RELEASE_TAG", ""),
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          os.makedirs('.release-status', exist_ok=True)
          with open('.release-status/notification.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
          encoded="$(base64 -w0 .release-status/notification.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json" \
              -f message='chore: record Android notification result [skip ci]' \
              -f content="$encoded" \
              -f sha="$current_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.release-status/notification.json" \
              -f message='chore: record Android notification result [skip ci]' \
              -f content="$encoded" \
              -f branch=main >/dev/null
          fi
