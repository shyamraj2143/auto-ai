name: Trigger urgent call hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-main-hotfix:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://auto-ai-production-a6ef.up.railway.app/api/v1
      AUTO_AI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AUTO_AI_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Execute deterministic patch embedded on main
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/urgent-call-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Prepare optional Firebase config"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('Unable to locate embedded patch script')
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in embedded.splitlines())
          original_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          tolerant_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              import re
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts if part)
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one flexible match in {path}, found {len(matches)}: {old[:100]!r}")
              match = matches[0]
              target.write_text(text[:match.start()] + new + text[match.end():], encoding="utf-8")'''
          if original_helper not in script:
              raise RuntimeError('Unable to replace patch helper')
          script = script.replace(original_helper, tolerant_helper, 1)
          script = script.replace(r'Calling service could not start\nAutoAI', r'Calling service could not start\\nAutoAI')
          script = script.replace('diagnostic?: string;', 'permissionRelated?: boolean;\n            diagnostic?: string;', 1)
          script = script.replace('return { title: "Microphone permission required", message: "Allow microphone access in Android Settings, then retry the call." };', 'return { title: "Microphone permission required", message: "Allow microphone access in Android Settings, then retry the call.", permissionRelated: true };', 1)
          script = script.replace('return { title: "Camera permission required", message: "Allow camera access for video calling, or answer using audio only." };', 'return { title: "Camera permission required", message: "Allow camera access for video calling, or answer using audio only.", permissionRelated: true };', 1)
          script = script.replace('return { title: "Calling permission blocked", message: "Android blocked a required call permission. Open AutoAI app settings and allow microphone and camera access." };', 'return { title: "Calling permission blocked", message: "Android blocked a required call permission. Open AutoAI app settings and allow microphone and camera access.", permissionRelated: true };', 1)
          script = script.replace('return { title: "Call notification unavailable", message: "Allow AutoAI call notifications in Android Settings, then retry." };', 'return { title: "Call notification unavailable", message: "Allow AutoAI call notifications in Android Settings, then retry.", permissionRelated: true };', 1)
          exec(compile(script, 'urgent_call_hotfix.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Prepare optional Firebase config
        shell: bash
        run: |
          if [ -n "${AUTO_AI_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$AUTO_AI_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Validate frontend and Android compilation
        shell: bash
        run: |
          npm ci
          npm ci --prefix frontend
          VITE_API_URL="$VITE_API_URL" npm run build
          npx cap sync android
          chmod +x android/gradlew
          ./android/gradlew -p android compileDebugJavaWithJavac

      - name: Commit validated fixes to main
        shell: bash
        run: |
          rm -f .github/workflows/urgent-call-hotfix.yml
          git config user.name "AutoAI Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Android audio and video calls"
          git push origin HEAD:main
