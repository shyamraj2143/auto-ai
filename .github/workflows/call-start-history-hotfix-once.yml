name: Apply call start and history hotfix once

on:
  push:
    branches:
      - fix/call-start-history
    paths:
      - ".github/workflows/call-start-history-hotfix-once.yml"

permissions:
  contents: write

concurrency:
  group: call-start-history-hotfix-once
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.event.head_commit.message == 'chore: run one-time call start history hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/call-start-history
          fetch-depth: 0

      - name: Apply targeted call and history patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          provider_path = Path("frontend/src/features/calls/CallProvider.tsx")
          calls_tab_path = Path("frontend/src/features/calls/CallsTab.tsx")
          calls_test_path = Path("frontend/src/features/calls/CallsTab.test.ts")

          provider = provider_path.read_text(encoding="utf-8")
          calls_tab = calls_tab_path.read_text(encoding="utf-8")
          calls_test = calls_test_path.read_text(encoding="utf-8")

          helper_anchor = '''function errorMessage(error: unknown, fallback: string) {
            return error instanceof Error ? error.message.replace(/^Request failed \\(\\d+\\):\\s*/, "") : fallback;
          }
          '''
          helper_replacement = helper_anchor + '''
          function announceCallHistoryChanged(callId?: string | null) {
            if (typeof window === "undefined") return;
            window.dispatchEvent(new CustomEvent("auto-ai-call-history-updated", {
              detail: { callId: callId || null },
            }));
          }
          '''
          if "function announceCallHistoryChanged" not in provider:
            if helper_anchor not in provider:
              raise SystemExit("CallProvider helper anchor not found")
            provider = provider.replace(helper_anchor, helper_replacement, 1)

          preflight_pattern = re.compile(
            r'''  const verifyCallPreflight = useCallback\(async \(\) => \{\n.*?\n  \}, \[token\]\);(?=\n\n  const stopRingtone)''',
            re.S,
          )
          preflight_replacement = '''  const verifyCallPreflight = useCallback(async () => {
            if (!token) throw new CallSetupError("SIGNALING_AUTH_FAILED", "Sign in again before starting a call.");
            let lastError: unknown = null;
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                if (callNative.isAndroid()) await syncNativeAccessToken(token);
                const nextConfig = await callApi.config(token);
                setConfig(nextConfig);
                configRef.current = nextConfig;
                if (!nextConfig.enabled) throw new Error("Calling is disabled.");
                if (!nextConfig.realtime_configured) {
                  throw new CallSetupError("SIGNALING_TIMEOUT", "Realtime calling is temporarily unavailable.");
                }
                return;
              } catch (preflightError) {
                lastError = preflightError;
                callDebug("call_preflight_retry", {
                  attempt: attempt + 1,
                  error_code: failureCodeOf(preflightError, "SIGNALING_TIMEOUT"),
                });
                if (attempt < 3) await new Promise((resolve) => window.setTimeout(resolve, 500 * 2 ** attempt));
              }
            }
            throw lastError instanceof Error ? lastError : new Error("Calling setup is temporarily unavailable.");
          }, [token]);'''
          provider, count = preflight_pattern.subn(preflight_replacement, provider, count=1)
          if count != 1:
            raise SystemExit(f"Expected one verifyCallPreflight replacement, got {count}")

          cleanup_anchor = '''    await callNative.stopActiveCall(cleanedCallId).catch(() => undefined);
            if (cleanedCallId) nativeServiceCallIdsRef.current.delete(cleanedCallId);
            if (detail) setError(detail);'''
          cleanup_replacement = '''    await callNative.stopActiveCall(cleanedCallId).catch(() => undefined);
            if (cleanedCallId) {
              nativeServiceCallIdsRef.current.delete(cleanedCallId);
              announceCallHistoryChanged(cleanedCallId);
            }
            if (detail) setError(detail);'''
          if cleanup_anchor not in provider:
            raise SystemExit("Cleanup anchor not found")
          provider = provider.replace(cleanup_anchor, cleanup_replacement, 1)

          incoming_anchor = '''      callRef.current = incomingCall;
            setCall(incomingCall);
            setPendingPeer(incomingCall.peer);'''
          incoming_replacement = '''      callRef.current = incomingCall;
            setCall(incomingCall);
            announceCallHistoryChanged(incomingCall.id);
            setPendingPeer(incomingCall.peer);'''
          if incoming_anchor not in provider:
            raise SystemExit("Incoming call anchor not found")
          provider = provider.replace(incoming_anchor, incoming_replacement, 1)

          created_anchor = '''      callRef.current = created;
            setCall(created);
            setSessionState("notifying");'''
          created_replacement = '''      callRef.current = created;
            setCall(created);
            announceCallHistoryChanged(created.id);
            setSessionState("notifying");'''
          if created_anchor not in provider:
            raise SystemExit("Created call anchor not found")
          provider = provider.replace(created_anchor, created_replacement, 1)

          history_anchor = '''      if (historyResult.status === "fulfilled") setHistory(historyResult.value.items);'''
          history_replacement = '''      if (historyResult.status === "fulfilled") {
                const uniqueHistory = Array.from(
                  new Map(historyResult.value.items.map((item) => [item.id, item] as const)).values(),
                ).sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));
                setHistory(uniqueHistory);
              } else if (notifyOnError) {
                setMessage(errorText(historyResult.reason, "Unable to load recent calls."));
              }'''
          if history_anchor not in calls_tab:
            raise SystemExit("History result anchor not found")
          calls_tab = calls_tab.replace(history_anchor, history_replacement, 1)

          refresh_effect_anchor = '''  useEffect(() => {
            if (refreshRequestId > 0) void refresh(true);
          }, [refresh, refreshRequestId]);
          '''
          refresh_effect_replacement = refresh_effect_anchor + '''
          useEffect(() => {
            const handleCallHistoryUpdate = () => {
              if (view === "calls") void refresh(false);
            };
            window.addEventListener("auto-ai-call-history-updated", handleCallHistoryUpdate);
            return () => window.removeEventListener("auto-ai-call-history-updated", handleCallHistoryUpdate);
          }, [refresh, view]);
          '''
          if "handleCallHistoryUpdate" not in calls_tab:
            if refresh_effect_anchor not in calls_tab:
              raise SystemExit("Refresh listener anchor not found")
            calls_tab = calls_tab.replace(refresh_effect_anchor, refresh_effect_replacement, 1)

          view_effect_anchor = '''  useEffect(() => {
            if (view === "requests") void loadRequests();
            if (view === "chats") void loadChats();
            if (view === "alerts") void loadNotifications();
            if (view === "search" && query.trim().length < 2) void loadSearchHistory();
          }, [loadChats, loadNotifications, loadRequests, loadSearchHistory, query, view]);'''
          view_effect_replacement = '''  useEffect(() => {
            if (view === "requests") void loadRequests();
            if (view === "chats") void loadChats();
            if (view === "calls") void refresh(true);
            if (view === "alerts") void loadNotifications();
            if (view === "search" && query.trim().length < 2) void loadSearchHistory();
          }, [loadChats, loadNotifications, loadRequests, loadSearchHistory, query, refresh, view]);'''
          if view_effect_anchor not in calls_tab:
            raise SystemExit("Call Hub view effect anchor not found")
          calls_tab = calls_tab.replace(view_effect_anchor, view_effect_replacement, 1)

          test_anchor = '''  it("falls back to profile initials when an uploaded avatar URL fails", () => {'''
          test_block = '''  it("starts calls without blocking on TURN preflight and refreshes recent calls immediately", () => {
            expect(provider).toContain("const nextConfig = await callApi.config(token);");
            expect(provider).not.toContain("const [nextConfig, credentials] = await Promise.all([");
            expect(provider).toContain("announceCallHistoryChanged(created.id)");
            expect(provider).toContain("announceCallHistoryChanged(cleanedCallId)");
            expect(source).toContain('window.addEventListener("auto-ai-call-history-updated"');
            expect(source).toContain('if (view === "calls") void refresh(true);');
            expect(source).toContain("Unable to load recent calls.");
            expect(source).toContain("new Map(historyResult.value.items.map");
          });

          '''
          if "starts calls without blocking on TURN preflight" not in calls_test:
            if test_anchor not in calls_test:
              raise SystemExit("CallsTab test insertion anchor not found")
            calls_test = calls_test.replace(test_anchor, test_block + test_anchor, 1)

          provider_path.write_text(provider, encoding="utf-8")
          calls_tab_path.write_text(calls_tab, encoding="utf-8")
          calls_test_path.write_text(calls_test, encoding="utf-8")
          PY

      - name: Verify patch scope and formatting
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          expected="$(printf '%s\n' \
            frontend/src/features/calls/CallProvider.tsx \
            frontend/src/features/calls/CallsTab.test.ts \
            frontend/src/features/calls/CallsTab.tsx | sort)"
          test "$changed" = "$expected"
          if echo "$changed" | grep -E '(^|/)admin(/|$)|(^|/)Admin[^/]*\.(tsx|ts|jsx|js|py|java)$'; then
            echo "Admin-related file changed. Aborting."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run focused call UI tests
        run: npm --prefix frontend test -- src/features/calls/CallsTab.test.ts

      - name: Build production frontend
        env:
          AUTO_AI_SKIP_COMPRESSION: "1"
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend call tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio 'fakeredis[lua]'
          pytest -q backend/tests/test_calls.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync and verify Android build
        shell: bash
        run: |
          npx cap sync android
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileDebugJavaWithJavac :app:testDebugUnitTest

      - name: Commit verified hotfix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/call-start-history-hotfix-once.yml
          git diff --check
          git config user.name "AutoAI Call Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/features/calls/CallProvider.tsx \
            frontend/src/features/calls/CallsTab.tsx \
            frontend/src/features/calls/CallsTab.test.ts \
            .github/workflows/call-start-history-hotfix-once.yml
          git commit -m "fix: restore call start and recent call history [force-update]"
          git push origin HEAD:fix/call-start-history
