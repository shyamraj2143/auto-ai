<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Auto AI 3D developer showcase</title>
  <desc id="desc">A colorful glassmorphism and neon 3D banner for Auto AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#11105A"/>
      <stop offset="0.72" stop-color="#4A0D82"/>
      <stop offset="1" stop-color="#005CFF"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65F6FF"/>
      <stop offset="0.45" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF55D7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.055"/>
    </linearGradient>
    <radialGradient id="orb" cx="36%" cy="28%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.18" stop-color="#9EF9FF"/>
      <stop offset="0.48" stop-color="#7663FF"/>
      <stop offset="0.78" stop-color="#EF4DFF"/>
      <stop offset="1" stop-color="#17136A"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#79F7FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#79F7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#01030F" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="34" fill="url(#grid)"/>
  <circle cx="1160" cy="205" r="260" fill="url(#halo)" opacity="0.65"/>
  <circle cx="260" cy="430" r="230" fill="#FF4FD8" opacity="0.12"/>
  <path d="M0 388C220 336 404 454 641 385S1060 284 1440 342V480H0Z" fill="#020617" fill-opacity="0.32"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(78 66)">
      <rect width="190" height="38" rx="19" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <circle cx="22" cy="19" r="6" fill="#65F6FF" filter="url(#glow)"/>
      <text x="106" y="25" text-anchor="middle" fill="#E9FCFF" font-size="14" font-weight="800" letter-spacing="2.2">SHYAMRAJ LABS</text>
      <text x="0" y="122" fill="#FFFFFF" font-size="83" font-weight="900" letter-spacing="3">AUTO AI</text>
      <rect x="0" y="141" width="500" height="5" rx="2.5" fill="url(#neon)"/>
      <text x="2" y="184" fill="#DCE8FF" font-size="24" font-weight="600">A multi-model intelligence platform</text>
      <text x="2" y="217" fill="#B9C7E7" font-size="18">Chat · Voice · Vision · Documents · Memory · Realtime Calls</text>

      <g transform="translate(0 258)">
        <g>
          <rect width="148" height="48" rx="16" fill="url(#glass)" stroke="#65F6FF" stroke-opacity="0.45"/>
          <text x="74" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">FASTAPI CORE</text>
        </g>
        <g transform="translate(162 0)">
          <rect width="138" height="48" rx="16" fill="url(#glass)" stroke="#8F7CFF" stroke-opacity="0.5"/>
          <text x="69" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">REACT UI</text>
        </g>
        <g transform="translate(314 0)">
          <rect width="154" height="48" rx="16" fill="url(#glass)" stroke="#FF62D8" stroke-opacity="0.5"/>
          <text x="77" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">WEBRTC LIVE</text>
        </g>
      </g>
      <text x="2" y="355" fill="#9FB1D6" font-size="14" font-weight="700" letter-spacing="1.6">FULL-STACK · ANDROID · AI ORCHESTRATION · REALTIME SYSTEMS</text>
    </g>

    <g transform="translate(795 68)" filter="url(#shadow)">
      <ellipse cx="280" cy="344" rx="250" ry="42" fill="#020617" fill-opacity="0.52"/>
      <circle cx="300" cy="165" r="118" fill="url(#orb)"/>
      <circle cx="266" cy="126" r="28" fill="#FFFFFF" opacity="0.42"/>
      <circle cx="300" cy="165" r="147" fill="none" stroke="#8FF8FF" stroke-opacity="0.28" stroke-width="2"/>
      <circle cx="300" cy="165" r="175" fill="none" stroke="#FF68E2" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 12"/>
      <path d="M180 165H420M300 45V285" stroke="#FFFFFF" stroke-opacity="0.12"/>

      <g transform="translate(0 42) rotate(-7 105 68)">
        <rect width="220" height="135" rx="24" fill="url(#glass)" stroke="#9DF8FF" stroke-opacity="0.48"/>
        <rect x="18" y="18" width="84" height="10" rx="5" fill="#8DF7FF" opacity="0.9"/>
        <rect x="18" y="43" width="168" height="7" rx="3.5" fill="#FFFFFF" opacity="0.28"/>
        <rect x="18" y="62" width="142" height="7" rx="3.5" fill="#FFFFFF" opacity="0.18"/>
        <rect x="18" y="91" width="88" height="25" rx="12.5" fill="#5DF3FF" fill-opacity="0.2" stroke="#7CF5FF" stroke-opacity="0.7"/>
        <text x="62" y="108" text-anchor="middle" fill="#EFFFFF" font-size="11" font-weight="800">STREAMING</text>
      </g>

      <g transform="translate(420 18) rotate(7 95 70)">
        <rect width="190" height="146" rx="24" fill="url(#glass)" stroke="#FF69D9" stroke-opacity="0.5"/>
        <circle cx="45" cy="42" r="18" fill="#FF66D8" fill-opacity="0.35" stroke="#FF9FE8"/>
        <path d="M39 43l5 5 10-13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="76" y="30" width="82" height="8" rx="4" fill="#FFFFFF" opacity="0.4"/>
        <rect x="76" y="48" width="62" height="7" rx="3.5" fill="#FFFFFF" opacity="0.2"/>
        <rect x="24" y="91" width="142" height="30" rx="15" fill="#7A5CFF" fill-opacity="0.28"/>
        <text x="95" y="111" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">MEMORY ENGINE</text>
      </g>

      <g transform="translate(100 286) rotate(4 135 58)">
        <rect width="270" height="116" rx="24" fill="url(#glass)" stroke="#8C7BFF" stroke-opacity="0.55"/>
        <circle cx="41" cy="38" r="13" fill="#63F6FF"/>
        <circle cx="74" cy="38" r="13" fill="#8B70FF"/>
        <circle cx="107" cy="38" r="13" fill="#FF62D8"/>
        <path d="M33 83C66 57 101 100 135 75s66-5 105-27" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
