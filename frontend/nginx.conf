server {
  # Railway supplies the service port at runtime; Docker entrypoint rewrites
  # this placeholder to the actual PORT before nginx starts.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  etag on;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/javascript text/plain text/xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_ssl_server_name on;
  proxy_ssl_name auto-ai-app-download.up.railway.app;

  location = /health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass https://auto-ai-app-download.up.railway.app/api/;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  location = /live/ws {
    proxy_pass https://auto-ai-app-download.up.railway.app/api/v1/live/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /calls/ws {
    proxy_pass https://auto-ai-app-download.up.railway.app/api/v1/calls/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /screen-share/ws {
    proxy_pass https://auto-ai-app-download.up.railway.app/api/v1/screen-share/ws-ticket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /messages/ws {
    proxy_pass https://auto-ai-app-download.up.railway.app/api/v1/messages/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /sitemap.xml { default_type application/xml; try_files /sitemap.xml =404; }
  location = /robots.txt { default_type text/plain; try_files /robots.txt =404; }
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-store";
    try_files /site.webmanifest =404;
  }
  location = /api-config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    try_files /api-config.js =404;
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /icons/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
